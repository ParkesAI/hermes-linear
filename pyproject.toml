[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-linear"
version = "0.1.0"
description = "Linear Agent Session platform and attributed Linear tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ritchie" }]
dependencies = [
  "aiohttp>=3.12,<4",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ParkesAI/hermes-linear"
Repository = "https://github.com/ParkesAI/hermes-linear"
Issues = "https://github.com/ParkesAI/hermes-linear/issues"

[project.entry-points."hermes_agent.plugins"]
hermes-linear = "hermes_linear"

[project.scripts]
hermes-linear-oauth = "hermes_linear.oauth:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyyaml>=6,<7",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_linear"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_linear/plugin.yaml"

[tool.hatch.build.targets.sdist]
include = ["hermes_linear", "tests", "scripts", "docs", "plugin.yaml", "__init__.py", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
